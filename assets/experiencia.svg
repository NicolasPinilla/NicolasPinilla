<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#16223D" stroke-width="1"/>
    </pattern>
    <pattern id="pinsH" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect x="6" width="8" height="10" fill="#8A9BB8"/>
    </pattern>
    <style>
      text { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
      .trace { fill: none; stroke: #23365C; stroke-width: 3; }
      .flow { fill: none; stroke-width: 3; stroke-dasharray: 16 300; animation: f 2.6s linear infinite; }
      @keyframes f { from { stroke-dashoffset: 316; } to { stroke-dashoffset: 0; } }
      .pulse { animation: p 2.6s ease-in-out infinite; }
      @keyframes p { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      .led { animation: l 1s steps(1) infinite; }
      @keyframes l { 50% { opacity: .15; } }
    </style>
  </defs>
  <rect width="1000" height="300" rx="16" fill="#0A0F1E"/>
  <rect width="1000" height="300" rx="16" fill="url(#grid)"/>
  <text x="32" y="40" font-size="14" fill="#3C5480" letter-spacing="3">/// PLACA DE EXPERIENCIA</text>

  <!-- buses -->
  <path class="trace" d="M260 150H320"/>
  <path class="trace" d="M680 150H740"/>
  <path class="trace" d="M145 195V250H855V195"/>
  <path class="flow" stroke="#00E5FF" d="M260 150H320"/>
  <path class="flow" stroke="#FF2E88" d="M740 150H680" style="animation-delay:-1.3s"/>
  <path class="flow" stroke="#FFD60A" d="M145 195V250H855V195" style="stroke-dasharray:24 900;animation-duration:4s"/>

  <!-- chip lateral izquierdo -->
  <rect x="40" y="95" width="210" height="10" fill="url(#pinsH)"/>
  <rect x="40" y="195" width="210" height="10" fill="url(#pinsH)"/>
  <rect x="30" y="105" width="230" height="90" rx="8" fill="#111A33" stroke="#2E86AB" stroke-width="2"/>
  <circle cx="46" cy="120" r="4" fill="#2E86AB"/>
  <text x="145" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">ROBÓTICA COLOMBIA SAS</text>
  <text x="145" y="170" font-size="13" fill="#00E5FF" text-anchor="middle">Asesor Técnico</text>

  <!-- chip principal -->
  <rect x="340" y="50" width="320" height="10" fill="url(#pinsH)"/>
  <rect x="340" y="240" width="320" height="10" fill="url(#pinsH)"/>
  <rect class="pulse" x="314" y="54" width="372" height="192" rx="14" fill="none" stroke="#FFD60A" stroke-width="2" opacity=".4"/>
  <rect x="320" y="60" width="360" height="180" rx="10" fill="#111A33" stroke="#FFD60A" stroke-width="3"/>
  <circle cx="340" cy="80" r="5" fill="#FFD60A"/>
  <rect x="560" y="76" width="100" height="24" rx="12" fill="#7CFFB2"/>
  <circle class="led" cx="576" cy="88" r="4" fill="#0A0F1E"/>
  <text x="618" y="93" font-size="12" font-weight="700" fill="#0A0F1E" text-anchor="middle">ACTUAL</text>
  <text x="500" y="140" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">ELECTROEQUIPOS COLOMBIA</text>
  <text x="500" y="170" font-size="15" fill="#FFD60A" text-anchor="middle">Especialista Preventa K12</text>
  <text x="500" y="205" font-size="12" fill="#6F86A6" text-anchor="middle">soluciones K12 · robótica · STEAM · consultoría</text>

  <!-- chip lateral derecho -->
  <rect x="750" y="95" width="210" height="10" fill="url(#pinsH)"/>
  <rect x="750" y="195" width="210" height="10" fill="url(#pinsH)"/>
  <rect x="740" y="105" width="230" height="90" rx="8" fill="#111A33" stroke="#FF2E88" stroke-width="2"/>
  <circle cx="756" cy="120" r="4" fill="#FF2E88"/>
  <text x="855" y="145" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">GRUPO TKNOVA SAS</text>
  <text x="855" y="170" font-size="13" fill="#FF2E88" text-anchor="middle">Asesor Técnico</text>

  <text x="968" y="280" font-size="11" fill="#3C5480" text-anchor="end">REV. 2026 · HECHO EN COLOMBIA</text>
  <rect x="1.5" y="1.5" width="997" height="297" rx="15" fill="none" stroke="#1F3A66" stroke-width="3"/>
</svg>
