<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1C2B4A"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2E86AB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2E86AB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="0.45" stop-color="#0A0F1E" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
      .trace { fill: none; stroke: #22355A; stroke-width: 2; }
      .flow { fill: none; stroke: #00E5FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 14 520; animation: flow 6s linear infinite; }
      .flow.b { animation-delay: -2s; }
      .flow.c { animation-delay: -4s; stroke: #FFD60A; }
      @keyframes flow { from { stroke-dashoffset: 534; } to { stroke-dashoffset: 0; } }
      .node { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      .chip text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1000" height="340" rx="16" fill="#0A0F1E"/>
  <rect width="1000" height="340" rx="16" fill="url(#dots)"/>
  <rect width="1000" height="340" rx="16" fill="url(#glow)"/>

  <!-- red de nodos (derecha) -->
  <g>
    <path class="trace" d="M560 60H700L740 100H860L900 60H1000"/>
    <path class="trace" d="M600 170H690L730 130H820L860 170H1000"/>
    <path class="trace" d="M560 280H700L740 240H860L900 280H1000"/>
    <path class="trace" d="M740 100V130M860 170V240M730 130V240"/>
    <path class="flow"   d="M560 60H700L740 100H860L900 60H1000"/>
    <path class="flow b" d="M600 170H690L730 130H820L860 170H1000"/>
    <path class="flow c" d="M560 280H700L740 240H860L900 280H1000"/>
    <g fill="#0A0F1E" stroke="#00E5FF" stroke-width="2">
      <circle class="node" cx="740" cy="100" r="6"/>
      <circle class="node" cx="730" cy="130" r="6" style="animation-delay:-1s"/>
      <circle class="node" cx="860" cy="170" r="6" style="animation-delay:-2s"/>
      <circle class="node" cx="730" cy="240" r="6" style="animation-delay:-.5s"/>
      <circle class="node" cx="860" cy="240" r="6" style="animation-delay:-1.5s"/>
    </g>
    <rect x="770" y="182" width="64" height="40" rx="6" fill="#111A33" stroke="#FFD60A" stroke-width="2"/>
    <text x="802" y="207" class="mono" font-size="14" font-weight="700" fill="#FFD60A" text-anchor="middle">K12</text>
  </g>
  <rect width="1000" height="340" rx="16" fill="url(#fadeR)"/>

  <!-- identidad -->
  <rect x="56" y="58" width="4" height="22" fill="#00E5FF"/>
  <text x="72" y="75" class="mono" font-size="14" letter-spacing="3" fill="#7FA3C7">TECNOLOGÍA EDUCATIVA · COLOMBIA</text>

  <text x="54" y="150" class="sans" font-size="66" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Nicolás Pinilla</text>
  <text x="56" y="190" class="sans" font-size="21" fill="#C9D6E8">Especialista Preventa K12 en <tspan fill="#FFFFFF" font-weight="600">Electroequipos Colombia</tspan></text>

  <g class="chip">
    <rect x="56" y="228" width="168" height="34" rx="17" fill="#111A33" stroke="#2E86AB"/>
    <text x="140" y="250" fill="#C9D6E8" text-anchor="middle">Ingeniero de Sistemas</text>
    <rect x="236" y="228" width="246" height="34" rx="17" fill="#FFD60A"/>
    <text x="359" y="250" fill="#0A0F1E" text-anchor="middle">LEGO Education Teacher Trainer</text>
    <rect x="494" y="228" width="168" height="34" rx="17" fill="#111A33" stroke="#2E86AB"/>
    <text x="578" y="250" fill="#C9D6E8" text-anchor="middle">Robótica · STEAM</text>
  </g>

  <rect x="1" y="1" width="998" height="338" rx="15.5" fill="none" stroke="#1F3A66" stroke-width="2"/>
</svg>
