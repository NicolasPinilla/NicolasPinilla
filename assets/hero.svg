<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#2E86AB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2E86AB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'Fira Code', Consolas, 'Courier New', monospace; }
      .big  { font-family: 'Arial Black', 'Segoe UI Black', Impact, sans-serif; font-weight: 900; }
      .trace { fill: none; stroke: #23365C; stroke-width: 2; }
      .flow  { fill: none; stroke: #00E5FF; stroke-width: 2.5; stroke-dasharray: 18 420; animation: flow 4s linear infinite; }
      .flow.m { stroke: #FF2E88; animation-duration: 5.5s; animation-delay: -2s; }
      .flow.y { stroke: #FFD60A; animation-duration: 6.5s; animation-delay: -1s; }
      @keyframes flow { from { stroke-dashoffset: 438; } to { stroke-dashoffset: 0; } }

      .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
      @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
      .pupil { animation: look 6s ease-in-out infinite; }
      @keyframes look { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-7px); } 60% { transform: translateX(7px); } }
      .eq { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 0.9s ease-in-out infinite alternate; }
      @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
      .led { animation: led 1.2s steps(1) infinite; }
      @keyframes led { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }

      .g1 { animation: g1 3.2s steps(1) infinite; }
      .g2 { animation: g2 3.2s steps(1) infinite; }
      @keyframes g1 { 0%, 86%, 100% { transform: translate(0,0); } 88% { transform: translate(-6px,2px); } 91% { transform: translate(4px,-2px); } 94% { transform: translate(-3px,0); } }
      @keyframes g2 { 0%, 86%, 100% { transform: translate(0,0); } 88% { transform: translate(6px,-2px); } 91% { transform: translate(-4px,2px); } 94% { transform: translate(3px,0); } }
      .sweep { animation: sweep 6s linear infinite; }
      @keyframes sweep { from { transform: translateY(-80px); } to { transform: translateY(400px); } }
      .cursor { animation: led 1s steps(1) infinite; }
      .boot { animation: boot 1.6s steps(1) forwards; fill-opacity: 0; }
      @keyframes boot { to { fill-opacity: 1; } }
    </style>
  </defs>

  <rect width="1000" height="380" rx="16" fill="#0A0F1E"/>
  <rect width="1000" height="380" rx="16" fill="url(#grid)"/>
  <rect width="1000" height="380" rx="16" fill="url(#glow)"/>

  <!-- pistas de circuito -->
  <g>
    <path class="trace" d="M0 40H120L150 70H280"/>
    <path class="trace" d="M0 340H60L90 310V250"/>
    <path class="trace" d="M1000 30H880L850 60H700"/>
    <path class="trace" d="M1000 352H900L885 366H560"/>
    <path class="flow"   d="M0 40H120L150 70H280"/>
    <path class="flow m" d="M1000 352H900L885 366H560"/>
    <path class="flow y" d="M1000 30H880L850 60H700"/>
    <path class="flow"   d="M0 340H60L90 310V250" style="animation-delay:-3s"/>
    <g fill="#0A0F1E" stroke="#00E5FF" stroke-width="2">
      <circle cx="280" cy="70" r="5"/><circle cx="90" cy="250" r="5"/>
      <circle cx="700" cy="60" r="5"/><circle cx="560" cy="366" r="5"/>
    </g>
  </g>

  <!-- robot -->
  <g transform="translate(0,12)">
    <line x1="160" y1="72" x2="160" y2="100" stroke="#00E5FF" stroke-width="4"/>
    <circle class="led" cx="160" cy="66" r="8" fill="#FF2E88"/>
    <rect x="76" y="132" width="14" height="44" rx="4" fill="#2E86AB"/>
    <rect x="230" y="132" width="14" height="44" rx="4" fill="#2E86AB"/>
    <rect x="90" y="100" width="140" height="118" rx="20" fill="#111A33" stroke="#00E5FF" stroke-width="3"/>
    <rect class="eye" x="113" y="128" width="34" height="34" rx="8" fill="#00E5FF"/>
    <rect class="eye" x="173" y="128" width="34" height="34" rx="8" fill="#00E5FF"/>
    <g class="pupil" fill="#0A0F1E">
      <rect x="124" y="139" width="12" height="12" rx="3"/>
      <rect x="184" y="139" width="12" height="12" rx="3"/>
    </g>
    <g fill="#FFD60A">
      <rect class="eq" x="112" y="178" width="10" height="24" rx="2" style="animation-duration:.6s"/>
      <rect class="eq" x="126" y="178" width="10" height="24" rx="2" style="animation-duration:.9s"/>
      <rect class="eq" x="140" y="178" width="10" height="24" rx="2" style="animation-duration:.5s"/>
      <rect class="eq" x="154" y="178" width="10" height="24" rx="2" style="animation-duration:.8s"/>
      <rect class="eq" x="168" y="178" width="10" height="24" rx="2" style="animation-duration:.55s"/>
      <rect class="eq" x="182" y="178" width="10" height="24" rx="2" style="animation-duration:.75s"/>
      <rect class="eq" x="196" y="178" width="10" height="24" rx="2" style="animation-duration:.65s"/>
    </g>
    <rect x="132" y="218" width="56" height="14" fill="#2E86AB"/>
    <rect x="78" y="232" width="164" height="86" rx="14" fill="#111A33" stroke="#2E86AB" stroke-width="3"/>
    <rect x="128" y="250" width="64" height="48" rx="6" fill="#0A0F1E" stroke="#FFD60A" stroke-width="2"/>
    <text x="160" y="281" class="mono" font-size="16" font-weight="700" fill="#FFD60A" text-anchor="middle">K12</text>
    <circle class="led" cx="100" cy="256" r="5" fill="#00E5FF" style="animation-delay:-.4s"/>
    <circle class="led" cx="100" cy="274" r="5" fill="#FF2E88" style="animation-delay:-.8s"/>
    <circle class="led" cx="220" cy="256" r="5" fill="#FFD60A"/>
    <circle class="led" cx="220" cy="274" r="5" fill="#00E5FF" style="animation-delay:-.6s"/>
  </g>

  <!-- texto -->
  <text x="300" y="92" class="mono" font-size="15" fill="#00E5FF">&gt; iniciando NICOLAS.OS v2026 ...<tspan class="boot" fill="#7CFFB2"> [ OK ]</tspan></text>

  <g class="big" font-size="80">
    <text x="300" y="178" fill="#FF2E88" opacity="0.85" class="g1">NICOLÁS</text>
    <text x="300" y="178" fill="#00E5FF" opacity="0.85" class="g2">NICOLÁS</text>
    <text x="300" y="178" fill="#FFFFFF">NICOLÁS</text>
    <text x="300" y="262" fill="none" stroke="#00E5FF" stroke-width="2.5">PINILLA</text>
  </g>
  <rect x="300" y="282" width="56" height="5" fill="#FFD60A"/>

  <text x="300" y="316" class="mono" font-size="17" fill="#C9D6E8">Especialista Preventa K12 · Ingeniero de Sistemas</text>
  <text x="300" y="342" class="mono" font-size="15" fill="#6F86A6">robótica educativa · STEAM · tecnología para el aula<tspan class="cursor" fill="#00E5FF"> █</tspan></text>

  <text transform="translate(968 190) rotate(90)" class="mono" font-size="11" letter-spacing="4" fill="#3C5480" text-anchor="middle">// EDTECH · K12 · CO //</text>

  <!-- capa CRT -->
  <rect class="sweep" x="0" y="0" width="1000" height="80" fill="url(#bar)"/>
  <rect width="1000" height="380" rx="16" fill="url(#scan)" opacity="0.5"/>
  <rect x="1.5" y="1.5" width="997" height="377" rx="15" fill="none" stroke="#1F3A66" stroke-width="3"/>
</svg>
